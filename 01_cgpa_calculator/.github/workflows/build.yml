name: CI — Build & Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1 : Build C++ backend sur Ubuntu
  # ─────────────────────────────────────────────────────────────
  build-backend-linux:
    name: 🐧 Backend C++ (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake & build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure (CMake)
        working-directory: 01_cgpa_calculator
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: 01_cgpa_calculator
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Verify binary exists
        working-directory: 01_cgpa_calculator/build
        run: |
          test -f cgpa_calculator && echo "✅ Binary OK" || (echo "❌ Binary missing" && exit 1)

      - name: Upload binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cgpa_calculator-linux
          path: 01_cgpa_calculator/build/cgpa_calculator
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2 : Build C++ backend sur Windows
  # ─────────────────────────────────────────────────────────────
  build-backend-windows:
    name: 🪟 Backend C++ (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        working-directory: 01_cgpa_calculator
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: 01_cgpa_calculator
        run: cmake --build build --config Release

      - name: Verify binary exists
        working-directory: 01_cgpa_calculator/build
        shell: pwsh
        run: |
          if (Test-Path "Release\cgpa_calculator.exe") {
            Write-Host "✅ Binary OK"
          } else {
            Write-Host "❌ Binary missing"; exit 1
          }

      - name: Upload binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cgpa_calculator-windows
          path: 01_cgpa_calculator/build/Release/cgpa_calculator.exe
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3 : Build React frontend
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: ⚛️  Frontend React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 01_cgpa_calculator/cgpa-frontend/package-lock.json

      - name: Install dependencies
        working-directory: 01_cgpa_calculator/cgpa-frontend
        run: npm ci

      - name: Build production bundle
        working-directory: 01_cgpa_calculator/cgpa-frontend
        run: npm run build

      - name: Check bundle size
        working-directory: 01_cgpa_calculator/cgpa-frontend
        run: |
          echo "📦 Bundle contents:"
          ls -lh dist/assets/
          TOTAL=$(du -sh dist/ | cut -f1)
          echo "📊 Total dist size: $TOTAL"

      - name: Upload dist (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cgpa-frontend-dist
          path: 01_cgpa_calculator/cgpa-frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4 : Résumé — s'exécute après tous les autres
  # ─────────────────────────────────────────────────────────────
  summary:
    name: ✅ All checks passed
    runs-on: ubuntu-latest
    needs: [build-backend-linux, build-backend-windows, build-frontend]
    if: success()

    steps:
      - name: Summary
        run: |
          echo "## 🎉 CI Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Linux  | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Windows| ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend React | ✅ |" >> $GITHUB_STEP_SUMMARY
